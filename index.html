<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0b30">
<meta name="color-scheme" content="dark">

<title>Novel</title>

<script>
/* Lite graphics: phones, low-memory / low-core devices, reduced-motion.
   Force with ?quality=low or ?quality=high */
(function () {
    var q = /[?&]quality=(low|high)/.exec(location.search);
    var low;
    if (q) {
        low = q[1] === "low";
    } else {
        var mem = navigator.deviceMemory, cores = navigator.hardwareConcurrency;
        low = matchMedia("(pointer: coarse)").matches ||
              Math.min(screen.width, screen.height) < 700 ||
              (mem && mem <= 4) || (cores && cores <= 4) ||
              matchMedia("(prefers-reduced-motion: reduce)").matches;
    }
    if (low) document.documentElement.classList.add("lite");
})();
</script>

<style>
:root {
    --ink: #0a0b30;
    --sky-top: #0a0b30;
    --sky-mid: #1d2178;
    --sky-low: #4652b8;
    --sky-mist: #8b98e6;
    --stone: #8a94d6;
    --stone-dark: #1a1d52;
    --gold: #c9d4ff;          /* moonlight accent (was gold) */
    --gold-bright: #f7f7f8;   /* loading-screen white */
    --parchment: #e8ecff;
    --parchment-dim: #dfe6ff;
}

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100%;
}

body {
    min-height: 100vh;
    min-height: 100svh;
    background: var(--ink);
    color: var(--parchment);
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    overflow-x: hidden;
}

/* ================================
   BACKGROUND SCENE
   ================================ */

/* NIGHT SKY */

.bg {
    position: fixed;
    inset: 0;
    z-index: 0;

    background:
        radial-gradient(
            circle at 20% 10%,
            rgba(150, 170, 255, 0.28) 0%,
            rgba(150, 170, 255, 0) 42%
        ),
        linear-gradient(
            180deg,
            var(--sky-top) 0%,
            #14175a 32%,
            var(--sky-mid) 58%,
            var(--sky-low) 82%,
            var(--sky-mist) 100%
        );
}

/* STARS (generated in the script at the bottom) */

.stars {
    position: fixed;
    inset: -40px;
    z-index: 0;
    pointer-events: none;
    --d: 3;
    transform: translate3d(calc(var(--px, 0) * var(--d) * 1px), calc(var(--py, 0) * var(--d) * 0.35px), 0);
    transform-origin: 50% calc(50vh + 40px);
}

.star {
    position: absolute;
    border-radius: 50%;
    background: #f4f6ff;
}

/* MOON */

.moon {
    position: fixed;
    z-index: 1;
    top: 5vh;
    left: 11vw;
    width: clamp(72px, 15vw, 140px);
    aspect-ratio: 1;
    border-radius: 50%;
    pointer-events: none;

    background:
        radial-gradient(circle at 62% 30%, rgba(115, 130, 210, 0.38) 0 8%, transparent 9%),
        radial-gradient(circle at 34% 64%, rgba(115, 130, 210, 0.32) 0 12%, transparent 13%),
        radial-gradient(circle at 70% 70%, rgba(115, 130, 210, 0.26) 0 7%, transparent 8%),
        radial-gradient(circle at 36% 38%, #ffffff 0%, #dbe5ff 45%, #9fb0f0 100%);

    box-shadow:
        0 0 30px 8px rgba(175, 195, 255, 0.6),
        0 0 110px 36px rgba(120, 140, 255, 0.3);
}

/* soft shadow on the moon's right edge, so it reads as a gibbous moon */

.moon::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: radial-gradient(
        circle at 26% 40%,
        transparent 55%,
        rgba(30, 36, 110, 0.55) 100%
    );
}

/* WISPY HIGH CLOUD STREAKS */

.wisp {
    position: fixed;
    z-index: 1;
    height: 14px;
    border-radius: 50%;
    background: linear-gradient(
        90deg,
        rgba(190, 200, 255, 0) 0%,
        rgba(190, 200, 255, 0.35) 50%,
        rgba(190, 200, 255, 0) 100%
    );
    filter: blur(4px);
    pointer-events: none;
}

.wisp1 { top: 5%;  left: 28%;  width: 62vw; transform: rotate(9deg); }
.wisp2 { top: 12%; right: -8%; width: 52vw; transform: rotate(-4deg); }
.wisp3 { top: 17%; left: -6%;  width: 40vw; transform: rotate(5deg); opacity: 0.6; }

/* DISTANT BRIDGE WITH BALUSTRADE */

.bridge {
    position: fixed;
    z-index: 1;
    left: 0;
    right: 0;
    bottom: 34vh;
    height: 1.6vh;
    background: #2a3080;
    opacity: 0.42;
    box-shadow: 0 1vh 0 #232970;
    pointer-events: none;
}

.bridge::before {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: 100%;
    height: 2.6vh;
    border-top: 3px solid #2c3488;
    background: repeating-linear-gradient(
        90deg,
        #2c3488 0 3px,
        transparent 3px 14px
    );
}

/* PILLARS (one shared shape, sized in vh so they scale with the screen) */

.pillar {
    position: fixed;
    bottom: -24px;
    height: var(--h);
    aspect-ratio: var(--ratio, 0.15);
    pointer-events: none;
    display: block;
}

.pillar-far {
    z-index: 1;
    color: #39418f;
    opacity: 0.3;
    filter: blur(0.8px);
}

.pillar-near {
    z-index: 3;
    color: #191d52;
}

.pillar-thin { --ratio: 0.075; }

/* CLOUD SEA */

.cl {
    position: fixed;
    z-index: 2;
    background: #b3bef4;
    border-radius: 100px;
    filter: blur(5px);
    opacity: 0.5;
    pointer-events: none;
}

.cl::before,
.cl::after {
    content: "";
    position: absolute;
    background: inherit;
    border-radius: 50%;
}

.cl::before { width: 50%; height: 130%; left: 14%; top: -55%; }
.cl::after  { width: 38%; height: 100%; right: 12%; top: -38%; }

.cl.hi { z-index: 1; opacity: 0.4; }

/* WALKWAY TO THE DOOR
   Starts just behind the door's platform (the door sits at the
   vertical center of the screen) and runs down past the bottom edge. */

.walkway {
    position: fixed;
    z-index: 3;
    left: 50%;
    width: 340px;
    margin-left: -170px;
    transform-origin: 50% -136px;
    top: calc(50vh + 136px);
    bottom: 0;
    pointer-events: none;
}

.walkway svg {
    display: block;
    width: 100%;
    height: 100%;
    overflow: visible;
}

.walkway.gone {
    display: none;
}

/* MIST OVER THE BASE OF EVERYTHING */

.mist {
    position: fixed;
    z-index: 4;
    left: 0;
    right: 0;
    bottom: 0;
    height: 42vh;
    pointer-events: none;
    background: linear-gradient(
        180deg,
        rgba(139, 152, 230, 0) 0%,
        rgba(139, 152, 230, 0.5) 65%,
        rgba(160, 174, 240, 0.7) 100%
    );
}

@media (prefers-reduced-motion: no-preference) {

    .star {
        animation: twinkle var(--dur, 4s) ease-in-out var(--delay, 0s) infinite;
    }

    @keyframes twinkle {
        0%, 100% { opacity: var(--o, 0.8); }
        50%      { opacity: calc(var(--o, 0.8) * 0.25); }
    }

    .cl {
        animation: drift var(--dur, 50s) ease-in-out var(--delay, 0s) infinite alternate;
    }

    @keyframes drift {
        from { translate: -24px 0; }
        to   { translate: 24px 0; }
    }

    .wisp {
        animation: wisp-drift 40s ease-in-out infinite alternate;
    }

    @keyframes wisp-drift {
        from { translate: -20px 0; }
        to   { translate: 20px 0; }
    }

}


/* ================================
   MAIN PAGE
   ================================ */

.page {
    width: 100%;
    max-width: 520px;
    min-height: 100vh;
    padding: 50px 25px 50px;
    text-align: center;
    position: relative;
    z-index: 5;

    display: flex;
    flex-direction: column;
    justify-content: center;
}

/* DOOR */

.door {
    width: 155px;
    height: 220px;
    margin: 0 auto;
    position: relative;

    cursor: pointer;

    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
}

/*
   Each layer of the door (the static frame/glow, the two
   panels, and the flash) is its own top-level <svg>, stacked
   with absolute positioning. Applying transforms directly to
   a top-level <svg> element is reliable across browsers,
   unlike transforming an inner <g> via transform-box: fill-box.
*/

.door svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: visible;
    display: block;
}

.door-static,
.door-flash {
    pointer-events: none;
}

/* once opened, the door is removed from the page */

.door.gone {
    display: none;
}

.door-panel {
    transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
    will-change: transform;
}

/*
   Each leaf hinges at the outer stone wall (the outside edge
   of its own path, x=30 for the left leaf / x=118 for the
   right leaf out of the 148-wide viewBox) rather than at the
   center — so as it scales down it collapses back against
   the wall, the way the reference animation does.
*/

.door-left  { transform-origin: 20.3% 50%; }
.door-right { transform-origin: 79.7% 50%; }

.door.open .door-left {
    transform: scaleX(0.16) skewY(8deg);
}

.door.open .door-right {
    transform: scaleX(0.16) skewY(-8deg);
}

.door-glow {
    opacity: 0.55;
    transition: opacity 0.6s ease;
}

.door.open .door-glow {
    opacity: 1;
}

.door-flash {
    opacity: 0;
}

.door.open .door-flash {
    animation: door-flash-burst 0.75s ease-out;
}

@keyframes door-flash-burst {
    0%   { opacity: 0;    transform: scale(0.4); }
    28%  { opacity: 0.95; transform: scale(1.05); }
    100% { opacity: 0;    transform: scale(1.7); }
}

/* SCREEN FLOOD — expands from the door's on-screen position to cover the viewport */

.screen-flash {
    position: fixed;
    top: 0;
    left: 0;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--gold-bright);
    opacity: 0;
    transform: translate(-50%, -50%) scale(0);
    pointer-events: none;
    z-index: 50;
    transition: transform 0.5s cubic-bezier(0.22, 0.61, 0.36, 1), opacity 0.5s ease;
}

.screen-flash.open {
    opacity: 1;
    transform: translate(-50%, -50%) scale(var(--flash-scale, 60));
}

/* LOADING SCREEN — shown once the flood has fully covered the screen */

.loading-screen {
    position: fixed;
    inset: 0;
    z-index: 60;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;

    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease;
}

.loading-screen.show {
    opacity: 1;
    pointer-events: auto;
}

.loading-icons {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(8px, 2.4vw, 14px);
    color: #6e6e75;
}

.licon {
    position: relative;
    display: block;
    width: clamp(24px, 6.8vw, 36px);
    height: clamp(24px, 6.8vw, 36px);
}

.licon svg {
    width: 100%;
    height: 100%;
    display: block;
    overflow: visible;
    fill: currentColor;
    stroke: none;
    opacity: 0.92;
}

/* strokes that punch the light background through the dark shapes */

.licon .cut {
    fill: none;
    stroke: var(--gold-bright);
    stroke-linecap: round;
    stroke-linejoin: round;
}

/* strokes drawn in the icon's own color */

.licon .ink {
    fill: none;
    stroke: currentColor;
    stroke-linecap: round;
}

/* little golden glint that ignites each icon */

.spark {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 5px;
    height: 5px;
    margin: -2.5px 0 0 -2.5px;
    border-radius: 50%;
    background: radial-gradient(circle, #fff7d6 0%, #f2c45c 55%, rgba(242, 196, 92, 0) 72%);
    box-shadow: 0 0 8px 2px rgba(242, 196, 92, 0.75);
    opacity: 0;
    pointer-events: none;
}

.spark::before,
.spark::after {
    content: "";
    position: absolute;
    background: linear-gradient(90deg, rgba(242, 196, 92, 0), #f2c45c, rgba(242, 196, 92, 0));
}

.spark::before { left: -7px; right: -7px; top: 2px; height: 1px; }
.spark::after  { top: -7px; bottom: -7px; left: 2px; width: 1px; background: linear-gradient(180deg, rgba(242, 196, 92, 0), #f2c45c, rgba(242, 196, 92, 0)); }

/* the icons light up one by one, left to right, and stay lit */

@media (prefers-reduced-motion: no-preference) {

    .licon svg {
        opacity: 0.07;
    }

    .loading-screen.run .licon svg {
        animation: icon-light 0.55s ease-out forwards;
        animation-delay: calc(var(--i) * 0.3s + 0.18s);
    }

    .loading-screen.run .spark {
        animation: icon-spark 0.85s ease-out forwards;
        animation-delay: calc(var(--i) * 0.3s);
    }

    @keyframes icon-light {
        from { opacity: 0.07; }
        to   { opacity: 0.92; }
    }

    @keyframes icon-spark {
        0%   { opacity: 0; transform: scale(0.3); }
        35%  { opacity: 1; transform: scale(1.25); }
        100% { opacity: 0; transform: scale(1.9); }
    }

}


/* TITLE */

h1 {
    font-family: Georgia, serif;
    font-size: 48px;
    margin: 0 0 5px;
    color: var(--parchment);
    text-shadow:
        0 0 18px rgba(170, 190, 255, 0.55),
        0 3px 10px rgba(5, 6, 30, 0.6);
}

.tagline {
    font-family: Georgia, serif;
    font-style: italic;
    font-size: 20px;
    margin: 0 0 40px;
    color: var(--parchment);
    text-shadow: 0 2px 8px rgba(5, 6, 30, 0.6);
}


/* LINKS */

.paths {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 15px;
}

/*
   The title, tagline, links and footer all live in .intro.
   Hidden at first; the door removes itself and .intro is
   readied (invisible) while the loading screen covers
   everything, then fades in once the loading screen clears.
*/

.intro {
    display: none;
}

.intro.ready {
    display: block;
    pointer-events: none;
}

.intro.revealed {
    pointer-events: auto;
}

/* each piece starts hidden, then is animated in one by one */

.intro.ready h1 .ch,
.intro.ready [data-tag],
.intro.ready [data-r] {
    opacity: 0;
}

.intro.revealed h1 .ch,
.intro.revealed [data-tag],
.intro.revealed [data-r] {
    opacity: 1;
}

h1 .ch {
    display: inline-block;
}

.tagline {
    white-space: nowrap;
    letter-spacing: 0.04em;
}

.path {
    display: flex;
    align-items: center;

    width: 100%;
    padding: 16px;

    text-decoration: none;
    color: white;

    background: rgba(10, 12, 48, 0.68);

    border: 1px solid rgba(185, 196, 255, 0.28);
    border-radius: 5px;

    transition: 0.25s;
}

.path:hover {
    border-color: var(--gold);
    transform: translateX(4px);
    box-shadow: 0 0 20px rgba(170, 190, 255, 0.4);
}

.path:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 3px;
}

.icon {
    width: 25px;
    height: 25px;
    margin-right: 15px;
    color: var(--gold);
}

.text {
    text-align: left;
}

.name {
    display: block;
    font-size: 17px;
    font-weight: bold;
}

.handle {
    display: block;
    margin-top: 3px;
    font-size: 13px;
    color: var(--gold);
}

.arrow {
    margin-left: auto;
    color: var(--gold);
    font-size: 20px;
}


/* MUSIC */

.music {
    width: 100%;
}

/*
   The music player is now hidden.
   The song plays in the background.
*/

.music-title {
    display: none;
}

audio {
    display: none;
}


/* FOOTER */

footer {
    margin-top: 35px;
    font-family: Georgia, serif;
    font-style: italic;
    font-size: 13px;
    color: var(--parchment-dim);
    text-shadow: 0 1px 6px rgba(10, 12, 50, 0.85);
}

/* ================================
   ALIVE: parallax, motes, sparkles, door + reveal effects
   ================================ */

/* parallax layers: --px / --py (-1..1) are set from the script */

.layer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    transform: translate3d(calc(var(--px, 0) * var(--d, 0) * 1px), calc(var(--py, 0) * var(--d, 0) * 0.35px), 0);
    transform-origin: 50% 50vh;
    will-change: transform;
}

/* camera push toward the door while it opens */

.entering .layer,
.entering .stars,
.entering .walkway,
.entering .door {
    scale: 3.6;
    transition: scale 0.45s cubic-bezier(0.55, 0, 1, 0.45);
}

/* light flowing up the path toward the door */

.walk-pulse {
    position: absolute;
    inset: 0;
    clip-path: polygon(20.6% 0, 79.4% 0, 91.8% 100%, 8.2% 100%);
    background: linear-gradient(to top, rgba(215, 225, 255, 0), rgba(215, 225, 255, 0.5) 50%, rgba(215, 225, 255, 0)) 0 150% / 100% 45% no-repeat;
    mix-blend-mode: screen;
    opacity: 0;
}

/* drifting motes of light */

.motes {
    position: fixed;
    inset: 0;
    z-index: 3;
    overflow: hidden;
    pointer-events: none;
}

.motes i {
    position: absolute;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: #e6edff;
    box-shadow: 0 0 7px 2px rgba(180, 196, 255, 0.7);
    opacity: 0;
}

.motes i.gold {
    background: #fff1c4;
    box-shadow: 0 0 7px 2px rgba(242, 196, 92, 0.65);
}

/* shooting stars */

.shoot {
    position: fixed;
    z-index: 1;
    width: 130px;
    height: 2px;
    border-radius: 2px;
    background: linear-gradient(90deg, rgba(255, 255, 255, 0), #ffffff);
    filter: drop-shadow(0 0 5px rgba(190, 205, 255, 0.95));
    opacity: 0;
    pointer-events: none;
    transform-origin: right center;
}

/* pointer / touch sparkle trail */

.sparkle {
    position: fixed;
    z-index: 45;
    width: 4px;
    height: 4px;
    margin: -2px 0 0 -2px;
    border-radius: 50%;
    background: #eaf0ff;
    box-shadow: 0 0 8px 2px rgba(190, 205, 255, 0.85);
    pointer-events: none;
}

.sparkle.gold {
    background: #fff3c9;
    box-shadow: 0 0 8px 2px rgba(242, 196, 92, 0.85);
}

/* bright stars get a soft flare */

.star.big {
    box-shadow: 0 0 6px 1px rgba(200, 215, 255, 0.85);
}

/* door: halo, seam of light, gems, tap ring */

.door-aura {
    position: absolute;
    left: 50%;
    top: 46%;
    width: 340px;
    height: 340px;
    margin: -170px 0 0 -170px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(175, 195, 255, 0.4) 0%, rgba(140, 160, 255, 0.16) 35%, rgba(140, 160, 255, 0) 66%);
    pointer-events: none;
    transition: filter 0.4s ease;
}

.door:hover .door-aura {
    filter: brightness(1.35);
}

.door-seam {
    position: absolute;
    left: 50%;
    top: 44px;
    width: 3px;
    height: 170px;
    margin-left: -1.5px;
    background: linear-gradient(180deg, rgba(235, 242, 255, 0), rgba(235, 242, 255, 0.95) 45%, rgba(235, 242, 255, 0));
    filter: blur(0.8px);
    opacity: 0.5;
    pointer-events: none;
}

.door-ring {
    position: absolute;
    left: 50%;
    top: 116px;
    width: 14px;
    height: 14px;
    margin: -7px 0 0 -7px;
    border-radius: 50%;
    border: 1.5px solid rgba(215, 225, 255, 0.85);
    opacity: 0;
    pointer-events: none;
}

.gem {
    filter: drop-shadow(0 0 3px #c9d4ff);
}

.door.open .door-seam,
.door.open .door-ring {
    opacity: 0;
    animation: none !important;
}

/* burst of light rays as the door opens (fixed to the screen, centered on the door) */

.rays-fx {
    position: fixed;
    z-index: 6;
    left: 50%;
    top: var(--door-cy, 50vh);
    width: 170vmax;
    height: 170vmax;
    margin: -85vmax 0 0 -85vmax;
    background: repeating-conic-gradient(rgba(235, 242, 255, 0.9) 0deg 2deg, rgba(235, 242, 255, 0) 2deg 9deg);
    -webkit-mask-image: radial-gradient(circle, #000 0%, rgba(0, 0, 0, 0) 55%);
    mask-image: radial-gradient(circle, #000 0%, rgba(0, 0, 0, 0) 55%);
    opacity: 0;
    pointer-events: none;
}

/* title letters + tagline */

@media (prefers-reduced-motion: no-preference) {

    body {
        animation: page-in 1.8s ease-out both;
    }

    @keyframes page-in {
        from { opacity: 0; }
        to   { opacity: 1; }
    }

    .moon {
        animation: moon-breathe 7s ease-in-out infinite alternate;
    }

    @keyframes moon-breathe {
        from { box-shadow: 0 0 30px 8px rgba(175, 195, 255, 0.55), 0 0 110px 36px rgba(120, 140, 255, 0.26); }
        to   { box-shadow: 0 0 44px 14px rgba(190, 208, 255, 0.75), 0 0 150px 56px rgba(120, 140, 255, 0.38); }
    }

    .motes i {
        animation: mote linear infinite;
    }

    @keyframes mote {
        0%   { opacity: 0;   transform: translate(0, 0); }
        15%  { opacity: 0.9; }
        85%  { opacity: 0.7; }
        100% { opacity: 0;   transform: translate(var(--dx, 0), calc(var(--rise, 30vh) * -1)); }
    }

    .shoot {
        animation: shoot 1.15s ease-in forwards;
    }

    @keyframes shoot {
        0%   { opacity: 0; transform: rotate(var(--a)) translateX(0); }
        12%  { opacity: 1; }
        100% { opacity: 0; transform: rotate(var(--a)) translateX(var(--dist)); }
    }

    .sparkle {
        animation: sparkle 0.95s ease-out forwards;
    }

    @keyframes sparkle {
        from { opacity: 1; transform: translate(0, 0) scale(1); }
        to   { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0.2); }
    }

    .walk-pulse {
        animation: walk-flow 3.8s linear infinite;
    }

    @keyframes walk-flow {
        0%   { opacity: 0;   background-position: 0 150%; }
        15%  { opacity: 0.8; }
        85%  { opacity: 0.8; }
        100% { opacity: 0;   background-position: 0 -55%; }
    }

    .door-aura {
        animation: aura 4.2s ease-in-out infinite;
    }

    @keyframes aura {
        0%, 100% { opacity: 0.55; transform: scale(0.94); }
        50%      { opacity: 1;    transform: scale(1.06); }
    }

    .door.open .door-aura {
        animation: aura-flare 1.4s ease-out forwards;
    }

    @keyframes aura-flare {
        from { opacity: 1; transform: scale(1); }
        to   { opacity: 1; transform: scale(3.2); }
    }

    .door-seam {
        animation: seam 4.2s ease-in-out infinite;
    }

    @keyframes seam {
        0%, 100% { opacity: 0.35; }
        50%      { opacity: 0.9; }
    }

    .door-ring {
        animation: ring 3s ease-out 1.4s infinite;
    }

    @keyframes ring {
        0%   { opacity: 0.85; transform: scale(0.6); }
        70%  { opacity: 0;    transform: scale(4.2); }
        100% { opacity: 0;    transform: scale(4.2); }
    }

    .gem {
        animation: gem 2.8s ease-in-out infinite;
    }

    @keyframes gem {
        0%, 100% { opacity: 0.45; }
        50%      { opacity: 1; }
    }

    .entering .rays-fx {
        animation: rays 1.6s ease-out forwards;
    }

    @keyframes rays {
        0%   { opacity: 0; transform: scale(0.15) rotate(0deg); }
        22%  { opacity: 1; }
        100% { opacity: 0; transform: scale(1) rotate(38deg); }
    }

    /* the reveal after loading: letters, tagline, links, footer */

    .intro.revealed h1 .ch {
        animation: letter 1.1s cubic-bezier(0.2, 0.7, 0.2, 1) backwards;
        animation-delay: calc(var(--k) * 0.11s + 0.1s);
    }

    .intro.revealed [data-tag] {
        animation: tag 1.7s ease-out 0.8s backwards;
    }

    .intro.revealed [data-r] {
        animation: rise 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) backwards;
        animation-delay: var(--rd, 0s);
    }

    .intro.revealed h1 {
        animation: title-glow 5s ease-in-out 2s infinite alternate;
    }

    @keyframes letter {
        from { opacity: 0; transform: translateY(20px) scale(0.9); filter: blur(10px); }
        to   { opacity: 1; transform: none; filter: blur(0); }
    }

    @keyframes tag {
        from { opacity: 0; letter-spacing: 0.24em; filter: blur(4px); }
        to   { opacity: 1; letter-spacing: 0.04em; filter: blur(0); }
    }

    @keyframes rise {
        from { opacity: 0; transform: translateY(16px); }
        to   { opacity: 1; transform: none; }
    }

    @keyframes title-glow {
        from { text-shadow: 0 0 14px rgba(170, 190, 255, 0.45), 0 3px 10px rgba(5, 6, 30, 0.6); }
        to   { text-shadow: 0 0 30px rgba(190, 208, 255, 0.95), 0 3px 10px rgba(5, 6, 30, 0.6); }
    }

}


/* =========================================================
   3D UPGRADE + DARK-MODE COLOR PROTECTION
   ========================================================= */

html {
    color-scheme: dark;
    forced-color-adjust: none;
}

body {
    color-scheme: dark;
    forced-color-adjust: none;
    perspective: 1400px;
}

.bg {
    transform: translateZ(-80px) scale(1.08);
    transform-origin: center;
    will-change: transform;
}

.moon {
    transform: translateZ(45px);
    box-shadow:
        0 0 30px 8px rgba(175, 195, 255, 0.60),
        0 0 110px 36px rgba(120, 140, 255, 0.30),
        inset -18px -12px 24px rgba(30, 36, 110, 0.28);
}

.walkway {
    perspective: 900px;
    transform-style: preserve-3d;
    filter:
        drop-shadow(0 22px 18px rgba(5, 7, 40, 0.42))
        drop-shadow(0 0 14px rgba(180, 195, 255, 0.12));
}

.walkway svg {
    transform:
        rotateX(6deg)
        translateZ(8px);
    transform-origin: 50% 0%;
}

.door {
    perspective: 1000px;
    transform-style: preserve-3d;
    filter:
        drop-shadow(0 24px 22px rgba(3, 5, 30, 0.55))
        drop-shadow(0 0 18px rgba(150, 170, 255, 0.18));
}

.door-static,
.door-panel,
.door-flash {
    transform-style: preserve-3d;
}

.door-static {
    filter:
        drop-shadow(7px 9px 0 rgba(12, 15, 60, 0.58))
        drop-shadow(0 0 12px rgba(180, 195, 255, 0.18));
}

.door-panel {
    backface-visibility: hidden;
    filter:
        drop-shadow(4px 6px 0 rgba(12, 15, 60, 0.55))
        drop-shadow(0 0 8px rgba(180, 195, 255, 0.15));
}

.door.open .door-left {
    transform:
        perspective(700px)
        rotateY(-68deg)
        scaleX(0.16)
        skewY(8deg);
}

.door.open .door-right {
    transform:
        perspective(700px)
        rotateY(68deg)
        scaleX(0.16)
        skewY(-8deg);
}

.path {
    position: relative;
    transform-style: preserve-3d;
    background:
        linear-gradient(
            145deg,
            rgba(35, 40, 110, 0.78),
            rgba(8, 10, 43, 0.86)
        );
    box-shadow:
        0 8px 0 rgba(12, 15, 60, 0.70),
        0 14px 25px rgba(3, 5, 30, 0.38),
        inset 0 1px 0 rgba(220, 230, 255, 0.12);
    transition:
        transform 0.25s ease,
        box-shadow 0.25s ease,
        border-color 0.25s ease;
}

.path::before {
    content: "";
    position: absolute;
    inset: 1px;
    border-radius: 9px;
    background:
        linear-gradient(
            135deg,
            rgba(255, 255, 255, 0.12),
            transparent 35%
        );
    pointer-events: none;
}

.path::after {
    content: "";
    position: absolute;
    left: 5px;
    right: 5px;
    bottom: -7px;
    height: 7px;
    background: #141852;
    border-radius: 0 0 8px 8px;
    transform: translateZ(-5px);
    pointer-events: none;
}

.path:hover {
    transform:
        perspective(700px)
        translate3d(5px, -5px, 8px)
        rotateX(2deg)
        rotateY(-2deg);
    box-shadow:
        0 12px 0 rgba(12, 15, 60, 0.72),
        0 22px 35px rgba(3, 5, 30, 0.50),
        0 0 25px rgba(170, 190, 255, 0.28);
}

.icon {
    transform: translateZ(10px);
    filter:
        drop-shadow(0 3px 3px rgba(3, 5, 30, 0.50))
        drop-shadow(0 0 6px rgba(201, 212, 255, 0.25));
}

h1 {
    transform-style: preserve-3d;
    text-shadow:
        0 1px 0 #c9d4ff,
        0 2px 0 #8f9be0,
        0 3px 0 #5c68b5,
        0 5px 10px rgba(5, 6, 30, 0.75),
        0 0 25px rgba(170, 190, 255, 0.55);
}

/* Keep the exact palette even under dark-mode preference. */
@media (prefers-color-scheme: dark) {
    html,
    body {
        color-scheme: dark;
        forced-color-adjust: none;
    }

    body {
        background: var(--ink);
        color: var(--parchment);
    }

    .path {
        color: white;
    }

    h1,
    .tagline,
    footer {
        color: var(--parchment);
    }

    a {
        color: inherit;
    }
}

/* Also stop Windows high-contrast/forced colors from replacing the palette. */
@media (forced-colors: active) {
    html,
    body,
    .path,
    .door,
    .intro {
        forced-color-adjust: none;
    }
}


/* =========================================================
   RESPONSIVE PC + MOBILE + STATIC PILLARS
   ========================================================= */

/* The pillars get their own layer so pointer/parallax movement
   can never move them. */
.pillar-static-layer {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
    transform: none !important;
    scale: 1 !important;
}

.pillar-static-layer .pillar {
    position: absolute;
    bottom: -24px;
    display: block;
    transform: none !important;
    translate: none !important;
    rotate: none !important;
    scale: 1 !important;
    will-change: auto;
}

.pillar-static-layer .pillar-far {
    z-index: 1;
}

.pillar-static-layer .pillar-near {
    z-index: 3;
}

/* Keep the whole scene inside the mobile viewport. */
html,
body {
    width: 100%;
    max-width: 100%;
    overflow-x: hidden;
}

.page {
    width: min(100%, 520px);
    padding-left: clamp(16px, 5vw, 25px);
    padding-right: clamp(16px, 5vw, 25px);
}

.walkway {
    width: min(340px, 78vw);
    margin-left: 0;
    transform: translateX(-50%);
}

.door {
    width: clamp(120px, min(42vw, 27vh), 190px);
    height: auto;
    aspect-ratio: 155 / 220;
}

.door svg {
    width: 100%;
    height: 100%;
}

h1 {
    font-size: clamp(36px, 12vw, 48px);
}

.tagline {
    font-size: clamp(15px, 5vw, 20px);
    white-space: normal;
}

.paths {
    gap: clamp(10px, 3vw, 15px);
}

.path {
    min-height: 58px;
    padding: clamp(12px, 4vw, 16px);
}

.name {
    font-size: clamp(15px, 4.5vw, 17px);
}

.handle {
    font-size: clamp(12px, 3.5vw, 13px);
}

.icon {
    flex: 0 0 25px;
}

/* Phones */
@media (max-width: 600px) {
    .page {
        min-height: 100svh;
        padding-top: 30px;
        padding-bottom: 30px;
    }

    .moon {
        top: 4vh;
        left: 7vw;
        width: clamp(58px, 20vw, 100px);
    }

    .wisp1 { width: 80vw; left: 18%; }
    .wisp2 { width: 70vw; right: -20%; }
    .wisp3 { width: 58vw; left: -16%; }

    .walkway {
        top: calc(50vh + 105px);
    }

    .mist {
        height: 35vh;
    }

    .door {
        margin-top: 5px;
    }

    footer {
        margin-top: 25px;
    }
}

/* Small phones */
@media (max-width: 380px) {
    .page {
        padding-left: 14px;
        padding-right: 14px;
    }

    .door {
        width: 125px;
    }

    .walkway {
        width: 72vw;
        top: calc(50vh + 95px);
    }

    .path {
        padding: 11px 12px;
    }

    .icon {
        width: 22px;
        height: 22px;
        flex-basis: 22px;
        margin-right: 11px;
    }
}

/* Landscape phones / short screens */
@media (max-height: 620px) {
    .page {
        padding-top: 18px;
        padding-bottom: 18px;
    }

    .door {
        width: 115px;
    }

    .tagline {
        margin-bottom: 20px;
    }

    .paths {
        gap: 8px;
    }

    .path {
        min-height: 48px;
        padding: 9px 12px;
    }

    footer {
        margin-top: 15px;
    }
}

/* Touch devices: don't rely on hover for anything important. */
@media (hover: none) and (pointer: coarse) {
    .path:hover {
        transform: none;
    }

    .path:active {
        transform: translateY(-2px);
    }
}

/* =========================================================
   PC + MOBILE POLISH
   ========================================================= */

html {
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
}

/* notches / rounded corners / home-indicator */
.page {
    padding-top: max(30px, env(safe-area-inset-top));
    padding-bottom: max(30px, env(safe-area-inset-bottom));
    padding-left: max(clamp(16px, 5vw, 25px), env(safe-area-inset-left));
    padding-right: max(clamp(16px, 5vw, 25px), env(safe-area-inset-right));
}

/* Safari needs the prefixed mask */
.rays-fx {
    -webkit-mask-image: radial-gradient(circle, #000 0%, rgba(0, 0, 0, 0) 55%);
}

/* keyboard access for the door */
.door:focus {
    outline: none;
}

.door:focus-visible {
    outline: 3px solid var(--gold);
    outline-offset: 10px;
    border-radius: 12px;
}

.path {
    -webkit-tap-highlight-color: rgba(201, 212, 255, 0.2);
}

/* long handles / narrow screens never overflow the card */
.text {
    min-width: 0;
}

.name,
.handle {
    overflow-wrap: anywhere;
}

/* Big screens: give the content a little more presence */
@media (min-width: 700px) and (min-height: 700px) {
    .page {
        width: min(100%, 600px);
    }

    h1 {
        font-size: 60px;
    }

    .tagline {
        font-size: 22px;
        margin-bottom: 44px;
    }

    .path {
        padding: 18px 20px;
    }

    .name {
        font-size: 18px;
    }

    .handle {
        font-size: 14px;
    }

    footer {
        font-size: 14px;
    }
}

/* Tap cue: always visible. Reduced-motion users get a still ring instead of the pulse. */
@media (prefers-reduced-motion: reduce) {
    .door-ring {
        opacity: 0.85;
        transform: scale(2.6);
    }

    .door.open .door-ring {
        opacity: 0;
    }
}

/* Reduced motion: keep the story, drop the camera push and long fades */
@media (prefers-reduced-motion: reduce) {
    .entering .layer,
    .entering .stars,
    .entering .walkway,
    .entering .door {
        scale: 1;
        transition: none;
    }

    .screen-flash {
        transition-duration: 0.3s;
    }

    .door-panel,
    .door-glow {
        transition: none;
    }
}

/* =========================================================
   NO SCROLLING: the page is locked to the screen
   ========================================================= */

html {
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
}

body {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    min-height: 0;
    overflow: hidden;
    overscroll-behavior: none;
}

.page {
    height: 100%;
    min-height: 0;
}

.intro {
    transform-origin: 50% 50%;   /* shrunk to fit by the script if the screen is very short */
}

@media (max-height: 460px) {
    .page {
        padding-top: max(8px, env(safe-area-inset-top));
        padding-bottom: max(8px, env(safe-area-inset-bottom));
    }

    h1 { font-size: 32px; margin-bottom: 2px; }
    .tagline { font-size: 14px; margin-bottom: 12px; }
    .paths { gap: 6px; }
    .path { min-height: 44px; padding: 7px 12px; }
    footer { margin-top: 10px; font-size: 12px; }
}

/* =========================================================
   LITE MODE (potato phones): no blur / drop-shadow filters,
   no continuous animations, no 3D, far fewer layers
   ========================================================= */

.lite body { perspective: none; }

.lite .bg,
.lite .moon { transform: none; will-change: auto; }

.lite .layer,
.lite .stars { transform: none !important; will-change: auto; }

.lite .star { animation: none !important; }
.lite .star.big { box-shadow: none; }

.lite .moon {
    animation: none !important;
    box-shadow: 0 0 24px 6px rgba(175, 195, 255, 0.45);
}

.lite .wisp { filter: none; animation: none !important; opacity: 0.7; }
.lite .wisp3 { display: none; }

/* soft clouds without blur: a plain gradient, and only four of them */
.lite .cl {
    filter: none;
    animation: none !important;
    border-radius: 50%;
    opacity: 0.75;
    background: radial-gradient(ellipse at 50% 55%,
        rgba(179, 190, 244, 0.8) 0%,
        rgba(179, 190, 244, 0.35) 45%,
        rgba(179, 190, 244, 0) 72%);
}
.lite .cl::before,
.lite .cl::after { display: none; }
.lite .cl.hi { display: none; }
.lite .layer .cl:nth-child(n+5) { display: none; }

.lite .bridge,
.lite .pillar-far,
.lite .motes,
.lite .shoot,
.lite .sparkle,
.lite .rays-fx,
.lite .walk-pulse,
.lite .spark,
.lite .door-flash { display: none !important; }

.lite .walkway { filter: none; perspective: none; transform-style: flat; }
.lite .walkway svg { transform: none; }

.lite .entering .layer,
.lite .entering .stars,
.lite .entering .walkway,
.lite .entering .door {
    scale: 2.4;
    transition: scale 0.4s cubic-bezier(0.55, 0, 1, 0.45);
}

.lite .door { perspective: none; transform-style: flat; filter: none; }
.lite .door-static,
.lite .door-panel { filter: none; will-change: auto; transform-style: flat; }
.lite .door-aura,
.lite .door-seam,
.lite .gem { animation: none !important; filter: none; transition: none; }
.lite .door.open .door-left  { transform: scaleX(0.16); }
.lite .door.open .door-right { transform: scaleX(0.16); }

/* the white flood becomes a plain fade instead of a giant scaling circle */
.lite .screen-flash,
.lite .screen-flash.open {
    left: 0 !important;
    top: 0 !important;
    width: 100%;
    height: 100%;
    border-radius: 0;
    transform: none !important;
}
.lite .screen-flash { transition: opacity 0.45s ease; }

.lite .loading-screen.run .licon svg { animation-delay: calc(var(--i) * 0.14s); }

/* flat, cheap link cards */
.lite .path {
    transform-style: flat;
    background: rgba(20, 24, 80, 0.88);
    box-shadow: 0 4px 0 rgba(12, 15, 60, 0.7);
    transition: none;
}
.lite .path::before,
.lite .path::after { display: none; }
.lite .path:hover,
.lite .path:active { transform: none; box-shadow: 0 4px 0 rgba(12, 15, 60, 0.7); }
.lite .icon { transform: none; filter: none; }

.lite h1 {
    transform-style: flat;
    text-shadow: 0 2px 0 #5c68b5, 0 0 12px rgba(170, 190, 255, 0.5);
}
.lite .tagline,
.lite footer { text-shadow: none; }

/* reveal = simple fades (no blur, no per-frame glow) */
@keyframes lite-fade { from { opacity: 0; } to { opacity: 1; } }

.lite .intro.revealed h1 { animation: none; }
.lite .intro.revealed h1 .ch {
    animation: lite-fade 0.5s ease-out backwards;
    animation-delay: calc(var(--k) * 0.05s);
}
.lite .intro.revealed [data-tag] { animation: lite-fade 0.6s ease-out 0.3s backwards; }
.lite .intro.revealed [data-r] {
    animation: lite-fade 0.5s ease-out backwards;
    animation-delay: calc(var(--rd, 0s) * 0.4);
}
.lite body { animation: none !important; }

</style>

            <span class="arrow">
                ↦
            </span>

        </a>

    </div>


    <footer data-r style="--rd:2s">
        The end justifies the means.
    </footer>

    </div>

</div>


<script>

/* ================================
   STARS
   ================================ */

const LITE = document.documentElement.classList.contains("lite");

(function makeStars() {

    const field = document.getElementById("stars");
    const COUNT = LITE ? 28 : (window.innerWidth < 600 ? 70 : 110);

    for (let i = 0; i < COUNT; i++) {

        const s = document.createElement("div");
        const big = Math.random() < 0.08;
        const size = big ? 2.4 + Math.random() * 1.2 : 1 + Math.random() * 1.4;
        const o = 0.35 + Math.random() * 0.6;

        s.className = big ? "star big" : "star";
        s.style.left = (Math.random() * 100) + "%";
        s.style.top = (Math.random() * 68) + "%";
        s.style.width = size + "px";
        s.style.height = size + "px";
        s.style.opacity = o;
        s.style.setProperty("--o", o);
        s.style.setProperty("--dur", (3 + Math.random() * 5) + "s");
        s.style.setProperty("--delay", (-Math.random() * 8) + "s");

        field.appendChild(s);

    }

})();


/* ================================
   DOOR + BACKGROUND MUSIC
   ================================ */

const door = document.getElementById("door");
const music = document.getElementById("bgMusic");
const screenFlash = document.getElementById("screenFlash");
const loadingScreen = document.getElementById("loadingScreen");
const intro = document.getElementById("intro");
const walkway = document.getElementById("walkway");

let doorIsOpen = false;
let floodTimer = null;
let loadingTimer = null;

const FLOOD_MS = LITE ? 450 : 500;    // matches the .screen-flash transition duration
const LOADING_MS = LITE ? 1700 : 2700;  // how long the loading screen stays up


/* Set background music volume */

music.volume = 0.5;


/*
   Position the flood circle exactly on the door's current
   on-screen center, and size it so that even scaled up, it
   reaches past the farthest corner of the viewport — so the
   white always fully covers the screen no matter where the
   door sits on the page or how big the window is.
*/

function sizeScreenFlash() {

    const rect = door.getBoundingClientRect();

    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;

    screenFlash.style.left = centerX + "px";
    screenFlash.style.top = centerY + "px";

    const farX = Math.max(centerX, window.innerWidth - centerX);
    const farY = Math.max(centerY, window.innerHeight - centerY);
    const reach = Math.sqrt(farX * farX + farY * farY) * 1.1;

    screenFlash.style.setProperty("--flash-scale", reach / 12);

}


/*
   TAP DOOR
   --------
   Closed → Open + Play + flood the screen with white, then
            once the flood covers everything, show a loading
            screen, then fade that away and reveal the links.
   The door is removed once it has opened, so it only opens once.
*/

/*
   Keep the walkway and light burst glued to the door on every
   screen size (phone, tablet, landscape, desktop) instead of
   assuming the door sits at a fixed offset from the middle.
*/

function alignScene() {

    if (doorIsOpen) return;

    const r = door.getBoundingClientRect();
    if (!r.width) return;

    const centerY = r.top + r.height / 2;
    const platformY = r.top + r.height * (232 / 220);

    document.documentElement.style.setProperty("--door-cy", centerY + "px");

    walkway.style.top = platformY + "px";
    walkway.style.width = Math.min(r.width * 2.2, window.innerWidth * 1.1) + "px";
    walkway.style.transformOrigin = "50% " + (centerY - platformY) + "px";

}

/* Shrink the links block if the screen is too short, so nothing ever needs scrolling */

const pageEl = document.querySelector(".page");

function fitIntro() {

    if (!intro.classList.contains("ready")) return;

    intro.style.transform = "";

    const cs = getComputedStyle(pageEl);
    const avail = window.innerHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    const natural = intro.offsetHeight;

    if (natural > avail) {
        intro.style.transform = "scale(" + Math.max(0.5, avail / natural).toFixed(3) + ")";
    }

}

window.addEventListener("resize", fitIntro);
window.addEventListener("orientationchange", function () { setTimeout(fitIntro, 250); });

alignScene();
window.addEventListener("load", alignScene);
window.addEventListener("resize", alignScene);
window.addEventListener("orientationchange", function () { setTimeout(alignScene, 250); });
if (window.visualViewport) window.visualViewport.addEventListener("resize", alignScene);

/* Enter / Space open the door for keyboard and screen-reader users */

let openedByKeyboard = false;

door.addEventListener("keydown", function (e) {

    if (e.key === "Enter" || e.key === " " || e.key === "Spacebar") {
        e.preventDefault();
        openedByKeyboard = true;
        door.click();
    }

});

door.addEventListener("click", function () {

    if (doorIsOpen === false) {

        /* OPEN DOOR */

        door.classList.add("open");
        document.body.classList.add("entering");

        doorIsOpen = true;


        /* FLOOD THE SCREEN */

        sizeScreenFlash();
        screenFlash.classList.add("open");


        /* PLAY MUSIC */

        music.currentTime = 0;

        music.play().catch(function(error) {

            console.log(
                "Music could not start:",
                error
            );

        });


        /* Once the flood has fully covered the screen, show the loading screen */

        if (floodTimer) clearTimeout(floodTimer);
        if (loadingTimer) clearTimeout(loadingTimer);

        floodTimer = setTimeout(function () {

            loadingScreen.classList.add("show", "run");

            /* Remove the door and ready the page while everything is covered */

            door.classList.add("gone");
            document.body.classList.remove("entering");
            walkway.classList.add("gone");
            intro.classList.add("ready");
            fitIntro();

            /* After a beat of "loading", clear it and reveal the links */

            loadingTimer = setTimeout(function () {

                loadingScreen.classList.remove("show");

                /* let the fade-out finish before the icons reset */
                setTimeout(function () {
                    loadingScreen.classList.remove("run");
                }, 500);

                screenFlash.classList.remove("open");
                intro.classList.add("revealed");
                intro.removeAttribute("inert");

                /* only move focus for keyboard users, so touch/mouse users never see a stray focus ring */
                const firstLink = intro.querySelector("a");
                if (openedByKeyboard && firstLink) firstLink.focus({ preventScroll: true });

            }, LOADING_MS);

        }, FLOOD_MS);

    }

});


/*
   Make sure the music stops if the
   audio somehow reaches an error.
*/

let resumeAfterHide = false;

document.addEventListener("visibilitychange", function () {

    if (document.hidden) {
        resumeAfterHide = !music.paused;
        if (resumeAfterHide) music.pause();
    } else if (resumeAfterHide) {
        music.play().catch(function () {});
        resumeAfterHide = false;
    }

});

music.addEventListener("error", function () {

    console.log(
        "DreamAria.mp3 could not be loaded."
    );

});




/* =========================================================
   KEEP PILLARS COMPLETELY STATIC
   ========================================================= */
(function () {
    const pillars = document.querySelectorAll(".pillar");

    if (!pillars.length) return;

    const staticLayer = document.createElement("div");
    staticLayer.className = "pillar-static-layer";
    staticLayer.setAttribute("aria-hidden", "true");

    document.body.appendChild(staticLayer);

    pillars.forEach(function (pillar) {
        staticLayer.appendChild(pillar);
    });
})();

/* ================================
   ALIVE: title letters, parallax, motes, shooting stars, sparkles
   ================================ */

(function () {

    const calm = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    /* Title: split into letters so they can appear one by one */

    const h1 = document.querySelector(".intro h1");
    const text = h1.textContent.trim();

    h1.setAttribute("aria-label", text);
    h1.innerHTML = Array.from(text).map(function (c, k) {
        return '<span class="ch" aria-hidden="true" style="--k:' + k + '">' + c + '</span>';
    }).join("");

    if (calm || LITE) return;


    /* Parallax: layers slide with the pointer, or sway by themselves when it is idle */

    const root = document.documentElement;
    let tx = 0, ty = 0, cx = 0, cy = 0, lastMove = -1e9;

    window.addEventListener("pointermove", function (e) {
        tx = (e.clientX / window.innerWidth - 0.5) * 2;
        ty = (e.clientY / window.innerHeight - 0.5) * 2;
        lastMove = performance.now();
    });

    function tick(t) {

        if (t - lastMove > 2500) {
            tx = Math.sin(t / 4200) * 0.75;
            ty = Math.sin(t / 5300 + 1) * 0.5;
        }

        cx += (tx - cx) * 0.05;
        cy += (ty - cy) * 0.05;

        root.style.setProperty("--px", cx.toFixed(4));
        root.style.setProperty("--py", cy.toFixed(4));

        requestAnimationFrame(tick);

    }

    requestAnimationFrame(tick);


    /* Motes of light drifting up from the clouds */

    const motes = document.getElementById("motes");

    for (let i = 0; i < (window.innerWidth < 600 ? 14 : 26); i++) {

        const m = document.createElement("i");
        const size = 2 + Math.random() * 2.4;

        m.style.left = (6 + Math.random() * 88) + "%";
        m.style.bottom = (Math.random() * 38) + "vh";
        m.style.width = size + "px";
        m.style.height = size + "px";
        m.style.setProperty("--dx", (Math.random() * 60 - 30) + "px");
        m.style.setProperty("--rise", (26 + Math.random() * 34) + "vh");
        m.style.animationDuration = (9 + Math.random() * 10) + "s";
        m.style.animationDelay = (-Math.random() * 16) + "s";

        if (Math.random() < 0.3) m.className = "gold";

        motes.appendChild(m);

    }


    /* Shooting stars, every so often */

    function shootingStar() {

        const s = document.createElement("div");

        s.className = "shoot";
        s.style.left = (8 + Math.random() * 60) + "%";
        s.style.top = (3 + Math.random() * 26) + "vh";
        s.style.setProperty("--a", (18 + Math.random() * 16) + "deg");
        s.style.setProperty("--dist", (260 + Math.random() * 260) + "px");

        document.body.appendChild(s);
        s.addEventListener("animationend", function () { s.remove(); });

        setTimeout(shootingStar, 5000 + Math.random() * 7000);

    }

    setTimeout(shootingStar, 2500);


    /* Sparkle trail behind the pointer / finger, and a burst on tap */

    function spark(x, y, spread) {

        const s = document.createElement("i");

        s.className = Math.random() < 0.25 ? "sparkle gold" : "sparkle";
        s.style.left = x + "px";
        s.style.top = y + "px";
        s.style.setProperty("--dx", ((Math.random() - 0.5) * spread) + "px");
        s.style.setProperty("--dy", (8 + Math.random() * spread) + "px");

        document.body.appendChild(s);
        s.addEventListener("animationend", function () { s.remove(); });

    }

    let lastSpark = 0;

    window.addEventListener("pointermove", function (e) {

        const now = performance.now();

        if (now - lastSpark < 45) return;
        lastSpark = now;

        spark(e.clientX, e.clientY, 30);

    });

    window.addEventListener("pointerdown", function (e) {

        for (let i = 0; i < 9; i++) spark(e.clientX, e.clientY, 70);

    });

})();

</script>

</body>
</html>
